<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071018">
<title>Explore Kolkata — Immersive Story Map</title>
<style>
html,body{margin:0;height:100%;background:#061019;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}.boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(circle at 50% 35%,#172937,#061019 58%);z-index:99999}.spinner{width:42px;height:42px;border:3px solid #2c3d4d;border-top-color:#c68f5c;border-radius:50%;animation:spin .85s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.boot b{font-size:18px}.boot span{font-size:12px;color:#bdc9d5}
</style>
</head>
<body>
<div class="boot"><div class="spinner"></div><b>Preparing Kolkata Story Map</b><span>Loading photos, map and immersive animations…</span></div>
<script>
(async()=>{
  try{
    const parts=await Promise.all([1,2,3,4].map(i=>fetch(`payload_${i}.txt?v=2`,{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('payload '+i);return r.text()})));
    const b64=parts.join('').trim();
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div style="padding:42px;background:#061019;color:#fff;min-height:100vh;font-family:Arial"><h2>Story Map could not start</h2><p>'+String(err)+'</p><p>Please refresh once.</p></div>';
  }
})();
</script>
</body>
</html>
